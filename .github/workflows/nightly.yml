name: Nightly LC Launcher

on:
    workflow_dispatch:
    schedule:
        - cron: "0 0 * * *"

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      target: windows
                    - os: ubuntu-latest
                      target: linux
                    - os: ubuntu-24.04-arm
                      target: linux-arm64
                    - os: macos-latest
                      target: darwin
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                node-version: latest

            - name: Install installer deps (Windows)
              if: matrix.os == 'windows-latest'
              shell: powershell
              run: choco install nsis -y

            - name: Install installer deps (Mac)
              if: matrix.os == 'macos-latest'
              run: HOMEBREW_REQUIRE_TAP_TRUST=1 brew install create-dmg

            - name: Install installer deps (Linux)
              if: matrix.os == 'ubuntu-latest'
              run: |
                sudo apt-get update
                sudo apt-get install -y zenity

            - name: Install installer deps (Linux ARM64)
              if: matrix.target == 'linux-arm64'
              run: |
                sudo apt-get update
                sudo apt-get install -y zenity

            - name: Build lib
              run: bun ./build-scripts/build-lib.js ${{ matrix.target }}

            - name: Build app
              run: node ./build-scripts/build.js ${{ matrix.target }}

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: build-${{ matrix.target }}
                path: |
                  dist/
                  !dist/__*

    build-appimage:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        steps:
            - name: Bootstrap keyring and git
              run: |
                pacman -Syu --noconfirm archlinux-keyring
                pacman -S --noconfirm --needed git

            - uses: actions/checkout@v4

            - uses: actions/cache@v4
              with:
                path: |
                  node_modules
                  /var/cache/pacman/pkg
                key: arch-linux-${{ hashFiles('package.json') }}
                restore-keys: arch-linux-

            - name: Install build dependencies
              run: |
                pacman -S --noconfirm --needed \
                  base-devel wget curl unzip zsync patchelf strace \
                  nodejs npm \
                  xorg-server-xvfb dbus \
                  gtk3 glib-networking librsvg bubblewrap \
                  webkit2gtk-4.1 gst-plugins-base gst-plugins-good

            - name: Install bun
              run: |
                wget -qO /tmp/bun.zip "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip"
                unzip -qo /tmp/bun.zip -d /tmp/bun
                mv /tmp/bun/bun /usr/local/bin/bun
                bun --version

            - name: Build lib
              run: bun ./build-scripts/build-lib.js linux

            - name: Build app
              run: node ./build-scripts/build.js linux

            - name: Build AppImage
              run: |
                chmod +x ./build-scripts/appimage.sh
                ./build-scripts/appimage.sh linux
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/upload-artifact@v4
              with:
                name: appimage-linux
                path: dist/appimage/*.AppImage*
                if-no-files-found: error

    publish:
        needs: [build, build-appimage]
        runs-on: ubuntu-latest
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: artifacts
                merge-multiple: true

            - name: Publish release
              uses: softprops/action-gh-release@v1
              with:
                tag_name: nightly-${{ github.run_id }}
                name: "Nightly Build ${{ github.run_id }}"
                body: "If you have any issues with the builds below, please contact an LC Launcher dev in our discord!"
                target_commitish: ${{ github.sha }}
                generate_release_notes: true
                prerelease: true
                files: artifacts/*
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}